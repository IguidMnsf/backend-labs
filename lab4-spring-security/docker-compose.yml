services:
  mysql:
    image: mysql:8.4
    container_name: lab4-mysql
    environment:
      MYSQL_ROOT_PASSWORD: lab4pass
      MYSQL_DATABASE: lab4_db
    ports:
      - "3306:3306"
    volumes:
      - lab4-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plab4pass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  lab4-mysql-data:
