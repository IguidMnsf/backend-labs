name: Vérification des labs backend

on:
  push:
  pull_request:

jobs:
  lab2-springboot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: lab2-springboot/pom.xml
      - name: Tester le LAB2
        working-directory: lab2-springboot
        run: mvn --batch-mode --no-transfer-progress test

  lab3-spring-jpa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: lab3-springboot/pom.xml
      - name: Tester le LAB3 avec H2
        working-directory: lab3-springboot
        run: mvn --batch-mode --no-transfer-progress test

  lab5-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lab5-node-product-api/package-lock.json
      - name: Installer les dépendances
        working-directory: lab5-node-product-api
        run: npm ci
      - name: Générer Swagger et exécuter les tests
        working-directory: lab5-node-product-api
        run: |
          npm run swagger
          npm test
